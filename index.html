name: Generar APK Android

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Descargar proyecto
    uses: actions/checkout@v4

  - name: Construir APK
    uses: cemcoe/web-to-apk-action@v1
    with:
      app_name: "Control de empleados"
      app_id: "com.controldeempleados.app"
      web_dir: "."
