name: Generar APK Android

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Descargar proyecto
    uses: actions/checkout@v4

  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Instalar herramientas
    run: |
      sudo apt-get update
      sudo apt-get install -y nodejs npm

  - name: Preparar aplicacion
    run: |
      npm install -g @capacitor/cli
      mkdir -p android-app/www
      cp index.html android-app/www/
      for f in *.css *.js; do
        if [ -f "$f" ]; then cp "$f" android-app/www/; fi
      done
      cd android-app
      npm init -y
      npm install @capacitor/core @capacitor/android
      npx cap init "Control de empleados" "com.controldeempleados.app" --web-dir www
      npx cap add android
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Guardar APK
    uses: actions/upload-artifact@v4
    with:
      name: Control-de-empleados-APK
      path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
